name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm \
            mtools \
            dosfstools \
            wget \
            xz-utils \
            build-essential \
            bison \
            flex \
            texinfo \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev

      # The i686-elf binutils + GCC cross-compiler is expensive to build
      # (tens of minutes), so cache toolchain/ keyed on the versions pinned
      # in build_scripts/config.mk. It only rebuilds when those change.
      - name: Cache i686-elf toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('build_scripts/config.mk') }}

      - name: Build cross-compiler
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: make toolchain

      - name: Build OS
        run: make

      - name: Upload floppy image
        uses: actions/upload-artifact@v4
        with:
          name: main_floppy.img
          path: build/main_floppy.img
          if-no-files-found: error
